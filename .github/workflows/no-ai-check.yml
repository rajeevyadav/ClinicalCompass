# "No embedded AI" guard — ClinicalCompass's core promise is that its
# compliance-decision logic contains no AI/ML code, no copilot/chatbot, and no
# AI-provider API calls. Every status is a deterministic, human-written rule.
# Fails the build if a future commit introduces one in shipped app/build code.
# (Docs and the AI Act module TEXT may talk about AI — the EU AI Act overlay —
# so only shipped/run source files are scanned, and the AI Act regulation
# citations are allow-listed.) A lightweight guardrail, not a legal certification.
name: No embedded AI check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject AI authorship / co-author trailers in commits
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git rev-parse "$BEFORE" >/dev/null 2>&1; then
            RANGE="$BEFORE..${{ github.sha }}"
          else
            RANGE="HEAD~1..HEAD"   # new branch / first push: check the tip
          fi
          if git log "$RANGE" --format='AUTHOR:%an <%ae>%nCOMMITTER:%cn <%ce>%n%b' \
             | grep -Ei 'anthropic\.com|noreply@anthropic|co-authored-by:[[:space:]]*(claude|anthropic)|generated with[[:space:]]+(\[?claude|anthropic)|\bclaude (code|opus|sonnet|haiku)\b'; then
            echo "::error::A commit carries AI authorship / co-author metadata. Commits must be authored solely by the maintainer (no AI attribution)."
            exit 1
          fi
          echo "No AI authorship/co-author metadata in the pushed commits."
      - name: Scan shipped app/build source for AI-provider or AI-assistant references
        run: |
          set -e
          FILES=$(find index.html service-worker.js scripts js electron -type f \( -name '*.js' -o -name '*.html' \) 2>/dev/null)
          PATTERN='openai\.com|anthropic\.com|api\.anthropic|copilot|chatgpt|claude-[a-z0-9-]*\.(js|json)|@anthropic-ai|@openai|langchain|tensorflow|onnxruntime|huggingface'
          HIT=0
          for f in $FILES; do
            if grep -EinH "$PATTERN" "$f"; then HIT=1; fi
          done
          if [ "$HIT" -eq 1 ]; then
            echo "::error::Found a reference to an AI provider/assistant/ML library in shipped app or build code. ClinicalCompass must stay AI-free in its runtime and toolchain."
            exit 1
          fi
          echo "Clean — no embedded AI/ML references found in shipped code."

      - name: Check no AI/ML runtime dependencies were added
        run: |
          set -e
          if [ -f package.json ]; then
            if grep -Ei '"(openai|@anthropic-ai/[a-z-]*|langchain|@tensorflow/[a-z-]*|onnxruntime-node|@huggingface/[a-z-]*)"[[:space:]]*:' package.json; then
              echo "::error::An AI/ML package is listed as a dependency in package.json."
              exit 1
            fi
          fi
          echo "package.json has no AI/ML dependencies."
