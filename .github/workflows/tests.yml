# Unit tests — the scoring/gating logic (checklist-engine + every rules module)
# runs on Node's built-in test runner (no external test deps). Runs on push/PR.
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests
        run: node --test
